[project]
name = "lennuk-thesis-harvester"
version = "0.1.0"
description = "Harvester for power-engineering theses from CEE/Baltic institutional repositories and national thesis systems"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14",
    "lxml>=5.0",
    "python-dateutil>=2.8",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
