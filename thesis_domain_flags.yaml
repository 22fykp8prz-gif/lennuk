# thesis_domain_flags.yaml — v2, 2026-07-31
# v2: tuned after the first 82k-record audit (flag_audit.csv, yaml v1):
#   - dropped acronyms CfD (matched CFD, computational fluid dynamics, 440x),
#     CRM (customer relationship management), MAF (minor allele frequency)
#   - energy_context 'power' replaced with phrases (matched emPOWERment, Power BI)
#   - demoted to weak: self-sufficiency, soběstačnost, system adequacy
#     (matched pension-system adequacy), pakankamum
#   - removed: 'energy security' (geopolitics flood; strong 'security of
#     supply' remains), 'imbalance' (class imbalance; 'imbalance settlement'
#     remains), 'liberali' narrowed to liberaliza/liberalisation
#
# Four independent boolean flags for the Lennuk thesis harvester:
#   frequency_reserves, capacity_market, adequacy_selfsufficiency, market_design
#
# Matching rules (implemented in harvester/flags.py):
#  - stems are substrings, matched after Unicode casefold + Latin-only
#    diacritic stripping (Cyrillic untouched); written here in natural
#    orthography so native speakers can review them
#  - acronyms match with word boundaries on the ORIGINAL text,
#    case-sensitive as listed plus a fully-uppercased variant
#  - weak stems only count when an energy_context stem also appears
#  - overlap between flags is intended; do not dedupe
#
# Review notes per country live in the companion reference document.

version: 2
date: "2026-07-31"

energy_context:
  stems:
    - elektr        # electricity family: ET/LV/LT/PL/CZ/SK/SL/RO/TR (elektrik)
    - energ         # energy/energia/energie/enerģija/energetika...
    - enerji        # TR
    - power syst    # bare 'power' matched emPOWERment and Power BI (v1 audit)
    - power market
    - power plant
    - power grid
    - power sector
    - electric power
    - grid
    - електр        # BG (Cyrillic, no diacritic stripping)
    - енерг         # BG

